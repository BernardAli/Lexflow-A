<div class="mb-3">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="lf-password">
    <input class="form-control form-control-lg{% if field.errors %} is-invalid{% endif %}" type="password" id="{{ field.id_for_label }}" name="{{ field.html_name }}" autocomplete="{{ autocomplete }}" required{% if field.errors %} aria-invalid="true"{% endif %}{% if field.help_text or field.errors %} aria-describedby="{% if field.help_text %}{{ field.id_for_label }}-help {% endif %}{% if field.errors %}{{ field.id_for_label }}-errors{% endif %}"{% endif %}>
    <button class="lf-password-toggle" type="button" data-password-toggle="{{ field.id_for_label }}" data-password-label="{{ field.label|lower }}" aria-controls="{{ field.id_for_label }}" aria-label="Show {{ field.label|lower }}" aria-pressed="false" hidden>
      <i class="bi bi-eye" aria-hidden="true"></i>
    </button>
  </div>
  {% if field.help_text %}<div class="form-text lf-auth-help" id="{{ field.id_for_label }}-help">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<div class="invalid-feedback d-block lf-auth-errors" role="alert" id="{{ field.id_for_label }}-errors">{{ field.errors }}</div>{% endif %}
</div>
