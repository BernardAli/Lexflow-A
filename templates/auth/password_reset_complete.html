{% extends "auth/base.html" %}
{% block title %}Password reset complete{% endblock %}
{% block auth_content %}
<div class="lf-auth-status mb-3"><i class="bi bi-check2-circle" aria-hidden="true"></i></div>
<h2 class="lf-title mb-2">Your password has been reset</h2>
<p class="lf-muted mb-4">You can now sign in to your office account with your new password.</p>
<a class="btn btn-primary btn-lg w-100" href="{% url 'core:login' %}">Sign in</a>
{% endblock %}
